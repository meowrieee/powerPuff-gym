<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Powerpuff Gym</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
<style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      color: white;
      font-family: 'Poppins', sans-serif;
      height: 100vh;
      overflow: hidden;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 20px 40px;
    }

    .logo img {
      height: 90px;
    }

    nav a {
      color: white;
      text-decoration: none;
      margin-left: 40px;
      font-weight: 700;
      font-size: 20px;
      padding: 12px 20px;
      transition: transform 0.3s ease, background 0.3s, color 0.3s;
      display: inline-block;
    }

    nav a:hover {
      background: linear-gradient(90deg, #53D8FB, #A1D2F4);
      color: black;
      transform: scale(1.1);
      border-radius: 5px;
    }

    .highlight {
      background-color: yellow;
      color: black;
      border-radius: 5px;
    }

    .main {
      position: relative;
      width: 100%;
      height: calc(100vh - 120px);
      display: flex;
      align-items: flex-end;
      justify-content: flex-end;
      padding: 0 50px;
    }

    .text-content {
      position: absolute;
      top: 50%;
      left: 7%;
      transform: translateY(-50%);
      text-align: left;
      max-width: 500px;
    }

    .text-content h1 {
      font-size: 110px;
      line-height: 1.1;
      font-family: 'Bebas Neue', sans-serif;
      letter-spacing: 2px;
    }

    .text-content h1 span {
      color: #4dd0e1;
    }

    .cta-button {
      margin-top: 30px;
    }

    .cta-button a {
      display: inline-block;
      background-color: #00acc1;
      color: white;
      padding: 15px 30px;
      font-size: 22px;
      font-weight: 600;
      text-decoration: none;
      border-radius: 5px;
      transition: transform 0.3s ease, background 0.3s ease;
      border: none;
      cursor: pointer;
    }

    .cta-button a:hover {
      background-color: #00838f;
      transform: scale(1.1);
      text-decoration: none;
    }

    .images {
      z-index: 1;
      position: absolute;
      bottom: 0;
      right: 20px;
    }

    .images img {
      height: 90vh;
      max-height: 90vh;
      object-fit: contain;
    }

    @media (max-width: 768px) {
      .text-content {
        position: static;
        transform: none;
        text-align: center;
        margin: 30px 20px;
      }

      .text-content h1 {
        font-size: 60px;
      }

      .cta-button a {
        font-size: 18px;
      }

      .images {
        position: relative;
        right: 0;
        display: flex;
        justify-content: center;
        margin-top: 20px;
      }

      .images img {
        height: auto;
        width: 100%;
      }
    }
</style>
</head>

<body style="background: url('background.jpg') no-repeat center center fixed; background-size: cover;">
<header>
  <div class="logo">
    <img src="logo.png" alt="Powerpuff Gym Logo" />
  </div>
  <nav>
    <a href="file:///C:/Users/mtbas/Downloads/CIT/FINAL%20WEBSITE/INTERIOR/interior.html">ATHLETIC FACILITY</a>
    <a href="file:///C:/Users/mtbas/Downloads/CIT/FINAL%20WEBSITE/ABOUT%20US/ABOUT%20US.html" class="highlight">ABOUT US</a>
  </nav>
</header>

<section class="main">
  <div class="text-content">
    <h1>BE FIT<br><span>AND</span><br>MUSCLE</h1>
    <div class="cta-button">
      <a href="file:///C:/Users/mtbas/Downloads/CIT/FINAL%20WEBSITE/2%20log%20in/2%20log%20in.html#">BEGIN YOUR JOURNEY</a>
    </div>
  </div>
  <div class="images">
    <img src="tao.png" alt="Gym People" />
  </div>
</section>
</body>
</html>
